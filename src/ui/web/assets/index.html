<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lush · 项目开发</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body><div class="app">
<header><div class="brand"><strong>Lush</strong><span id="project">连接项目…</span></div>
<button type="button" id="md-toggle" class="ghost" aria-pressed="true" title="按 Markdown 渲染 agent 输出；关闭则显示原文">Markdown 渲染：开</button>
<span id="agents"></span><span id="connection" role="status">连接中…</span></header>
<main><aside>
<div class="section-title"><h2>待提交缓存</h2><span id="draft-count" class="count">缓存空</span></div>
<div id="drafts"></div>
<div class="section-title"><h2>任务树</h2><span id="task-count" class="count"></span><select id="tree-sort" class="sort" aria-label="任务树排序方式"></select></div>
<div id="tasks"></div>
<div class="section-title"><h2>等你决定</h2><span id="notice-count" class="count"></span></div>
<div id="notices"></div>
</aside>
<section id="detail"><h2>任务详情</h2><p class="hint">从左侧选择任务或待决问题，查看结果、改动、子任务与事件时间线。</p></section>
</main>
<div class="composer"><form id="input-form"><label for="input">你想做什么？</label>
<textarea id="input" maxlength="32000" placeholder="添加一个登录页面；或者，先研究一下现有鉴权逻辑…（回车加入缓存；草稿可编辑、可勾选部分提交）"></textarea>
<div class="composer-foot"><button type="button" id="draft-add" class="ghost">加入缓存</button><button type="submit" id="draft-commit">提交并规划</button><span class="hint">先攒着：回车加入缓存，点草稿正文可改内容，勾选框决定这次提交哪几条；⌘/Ctrl+回车只把勾选的草稿交给一个 planner 拆任务、建依赖，然后才建 worktree。</span></div></form>
<p id="error" role="alert"></p></div>
</div></body></html>
