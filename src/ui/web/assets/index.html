<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Lush · Service Tree</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">LUSH / WEB UI</p>
      <h1>Service Tree</h1>
    </div>
    <div id="connection" class="connection" role="status">
      <span class="dot"></span>
      <span>正在连接</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel tree-panel" aria-labelledby="tree-title">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">SERVICES</p>
          <h2 id="tree-title">服务树</h2>
        </div>
        <button id="refresh" class="icon-button" type="button" aria-label="刷新服务树" title="刷新">↻</button>
      </div>
      <p id="tree-empty" class="empty" hidden>暂无 Service。</p>
      <div id="tree" class="tree" role="tree" aria-label="Service tree"></div>
    </section>

    <section class="panel task-panel" aria-labelledby="task-title">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">NEW TASK</p>
          <h2 id="task-title">创建 Task</h2>
        </div>
      </div>

      <div id="selection" class="selection empty-selection">
        <span class="selection-label">目标 Service</span>
        <strong id="selection-name">请从左侧选择</strong>
        <span id="selection-meta" class="selection-meta"></span>
      </div>

      <form id="task-form">
        <label for="goal">目标</label>
        <textarea id="goal" name="goal" rows="7" maxlength="100000" placeholder="描述希望这个 Service 完成的工作…" required disabled></textarea>
        <div class="form-footer">
          <p id="form-message" class="message" role="status"></p>
          <button id="submit" class="primary" type="submit" disabled>后台启动</button>
        </div>
      </form>

      <article id="task-card" class="task-card" hidden aria-live="polite">
        <div class="task-card-heading">
          <span id="task-id" class="task-id"></span>
          <span id="task-status" class="status"></span>
        </div>
        <p id="task-goal" class="task-goal"></p>
        <pre id="task-result" class="task-result" hidden></pre>
      </article>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
