<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lush · Tasks</title><link rel="stylesheet" href="/core.css"><script type="module" src="/app.js"></script></head>
<body><header><strong>Lush</strong><span id="project-name"></span><a href="/" id="project-home" hidden>项目列表</a><form method="post" action="/logout"><button type="submit">退出</button></form></header>
<main id="workspace" hidden>
  <section class="composer"><h1>新任务</h1><form id="say-form"><label for="goal">目标</label><textarea id="goal" rows="4" maxlength="32000" required></textarea><label for="parent-branch">父分支（留空使用当前分支）</label><input id="parent-branch" maxlength="512"><button class="agent-call" type="submit" id="say-submit">发送</button></form></section>
  <section><div class="heading"><h2>任务</h2><button id="refresh" type="button">刷新</button></div><ul id="tasks"></ul></section>
  <section><h2>待我处理</h2><ul id="notices"></ul></section>
  <section><h2>绑定已有分支</h2><form id="bind-form"><label for="bind-branch">本地分支名</label><input id="bind-branch" required><label for="bind-commit">已确认的 HEAD commit</label><input id="bind-commit" required pattern="[0-9a-f]{40,64}"><button type="submit" id="bind-submit" data-help="为已有本地分支建立静息 owner Task；不会提交或移动 Git ref">绑定</button></form></section>
  <section id="task-detail" hidden aria-live="polite"></section>
</main>
<section id="launcher" hidden><h1>选择项目</h1><form id="project-form"><label for="project-path">项目绝对路径</label><input id="project-path" required><button type="submit">打开</button></form><ul id="projects"></ul></section>
<p id="feedback" role="status" aria-live="polite"></p>
</body></html>
