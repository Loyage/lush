name: Code reader POSIX safety

# Keep the cross-platform matrix available on demand during early development.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-reader-posix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: ${{ matrix.os }} / Bun ${{ matrix.bun }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bun: ['1.2.0', '1.4.2']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      # The code reader uses only Bun/Node built-ins and the system libc/Git.
      # Serial entrypoint also works on the minimum supported Bun version.
      - run: bun run test:serial test/workspaces/code-posix.test.js test/workspaces/code-reader.test.js test/web/code-reader-api.test.js
