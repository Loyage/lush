name: Code reader POSIX safety

on:
  pull_request:
    paths:
      - 'src/core/workspaces/code*.js'
      - 'src/core/project/code.js'
      - 'src/rpc/registry.js'
      - 'src/rpc/handlers/task.js'
      - 'src/ui/web/server.js'
      - 'test/workspaces/code*.test.js'
      - 'test/web/code-reader-api.test.js'
      - '.github/workflows/code-reader-posix.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/workspaces/code*.js'
      - 'src/core/project/code.js'
      - 'src/rpc/registry.js'
      - 'src/rpc/handlers/task.js'
      - 'src/ui/web/server.js'
      - 'test/workspaces/code*.test.js'
      - 'test/web/code-reader-api.test.js'
      - '.github/workflows/code-reader-posix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-reader-posix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: ${{ matrix.os }} / Bun ${{ matrix.bun }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bun: ['1.2.0', '1.4.2']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      # The code reader uses only Bun/Node built-ins and the system libc/Git.
      # Serial entrypoint also works on the minimum supported Bun version.
      - run: bun run test:serial test/workspaces/code-posix.test.js test/workspaces/code-reader.test.js test/web/code-reader-api.test.js
