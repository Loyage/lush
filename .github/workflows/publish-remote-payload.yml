name: Publish verified remote payload Release

# Only official version tags publish. Ordinary main/PR/manual builds remain read-only artifacts.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '!v*-*'
      - '!v*\+*'

permissions:
  contents: read

concurrency:
  group: remote-payload-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'Loyage/lush'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Require an official tag matching package.json on main history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bun --eval 'const tag=process.env.RELEASE_TAG; const version=JSON.parse(await Bun.file("package.json").text()).version; if (!/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tag) || tag!=="v"+version) throw new Error("Official release tag must be vX.Y.Z and match package.json version");'
          git merge-base --is-ancestor HEAD origin/main

  native:
    needs: validate
    uses: ./.github/workflows/remote-payload.yml

  publish:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          name: lush-remote-payload
          path: node_modules/lush-remote-build/payload
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify both runtime archives against this exact tagged checkout without executing them
        run: >-
          bun --eval 'import {verifyDesktopRemotePayload} from "./scripts/desktop-remote-payload.js";
          verifyDesktopRemotePayload(process.cwd(), "node_modules/lush-remote-build/payload")'
      - name: Publish immutable identity-addressed payload assets (not desktop installers)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          payload=node_modules/lush-remote-build/payload
          tag=$(bun --eval 'const m=await Bun.file("node_modules/lush-remote-build/payload/manifest.json").json(); console.log("payload-v"+m.lush_version+"-"+m.fingerprint)')
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            existing=$(mktemp -d)
            trap 'rm -rf -- "$existing"' EXIT
            gh release download "$tag" --repo "$GH_REPO" --dir "$existing"
            # Never replace an existing identity-addressed release's assets.
            PAYLOAD_DIRECTORY="$existing" bun --eval 'import {verifyDesktopRemotePayload} from "./scripts/desktop-remote-payload.js"; verifyDesktopRemotePayload(process.cwd(), process.env.PAYLOAD_DIRECTORY)'
            printf 'Reused already verified Release %s; no assets replaced.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$tag" --repo "$GH_REPO" --target "$SOURCE_COMMIT" \
              --title "Lush remote runtime $RELEASE_TAG" --prerelease --latest=false \
              --notes "Verified native Linux x64/ARM64 runtime payloads for $RELEASE_TAG from $SOURCE_COMMIT. Download only for the matching Lush client identity. No desktop installer, signing or automatic client update." \
              "$payload/manifest.json" "$payload/lush-remote-linux-x64.tar.gz" "$payload/lush-remote-linux-arm64.tar.gz"
            printf 'Published identity-addressed payload Release %s for %s from %s.\n' "$tag" "$RELEASE_TAG" "$SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          fi
