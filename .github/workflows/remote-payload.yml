name: Linux remote runtime payloads

# Native, fixed-runtime artifacts only. No Release, install scripts, signing secrets or remote deployment.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - package.json
      - src/**
      - bin/**
      - docs/**
      - README.md
      - scripts/build-remote.js
      - test/packaging/remote-payload.test.js
      - .github/workflows/remote-payload.yml
  push:
    branches: [main]
    paths:
      - package.json
      - src/**
      - bin/**
      - docs/**
      - README.md
      - scripts/build-remote.js
      - test/packaging/remote-payload.test.js
      - .github/workflows/remote-payload.yml

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.target }} payload and runtime smoke test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Run packaging boundary and real native runtime tests
        run: bun test test/packaging/remote-payload.test.js
      - name: Build private runtime payload without desktop dependencies
        run: bun run scripts/build-remote.js --build
      - name: Verify archive, metadata, fingerprint and native runtime imports
        run: bun run scripts/build-remote.js --verify node_modules/lush-remote-build/payload --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: lush-remote-${{ matrix.target }}
          path: |
            node_modules/lush-remote-build/payload/manifest.json
            node_modules/lush-remote-build/payload/lush-remote-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  merge:
    name: Verify and combine both native architectures
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          pattern: lush-remote-linux-*
          path: node_modules/lush-remote-inputs
          merge-multiple: false
      - name: Combine verified matching source identities
        run: >-
          bun run scripts/build-remote.js --merge
          node_modules/lush-remote-inputs/lush-remote-linux-x64
          node_modules/lush-remote-inputs/lush-remote-linux-arm64
          --out node_modules/lush-remote-build/payload
      - name: Independently verify combined bundle
        run: bun run scripts/build-remote.js --verify node_modules/lush-remote-build/payload
      - uses: actions/upload-artifact@v4
        with:
          name: lush-remote-payload
          path: |
            node_modules/lush-remote-build/payload/manifest.json
            node_modules/lush-remote-build/payload/lush-remote-linux-x64.tar.gz
            node_modules/lush-remote-build/payload/lush-remote-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Acceptance boundaries
        run: |
          printf '%s\n' '## Remote runtime artifacts' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Both payloads were built and smoke-tested on native Linux runners. The combined manifest and archives are available as lush-remote-payload (14 days).' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'This does not validate SSH deployment, desktop authentication or a real model invocation. No GitHub Release, remote services or system configuration were changed.' >> "$GITHUB_STEP_SUMMARY"
