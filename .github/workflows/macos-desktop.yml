name: macOS desktop test bundles

# Unsigned artifacts only: no Release, signing secrets, notarization or update feed.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .gitattributes
      - package.json
      - bun.lock
      - src/**
      - bin/**
      - docs/**
      - README.md
      - scripts/*desktop*.js
      - scripts/build-remote.js
      - test/packaging/**
      - .github/workflows/remote-payload.yml
      - .github/workflows/macos-desktop.yml
  push:
    branches: [main]
    paths:
      - .gitattributes
      - package.json
      - bun.lock
      - src/**
      - bin/**
      - docs/**
      - README.md
      - scripts/*desktop*.js
      - scripts/build-remote.js
      - test/packaging/**
      - .github/workflows/remote-payload.yml
      - .github/workflows/macos-desktop.yml

permissions:
  contents: read

concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-payload:
    uses: ./.github/workflows/remote-payload.yml

  bundle:
    needs: remote-payload
    name: macOS ${{ matrix.arch }} (unsigned, local and remote)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked build dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: lush-remote-payload
          path: node_modules/lush-remote-inputs/combined
      - name: Explicitly prepare verified same-checkout Linux payloads
        run: bun run desktop:prepare node_modules/lush-remote-inputs/combined
      - name: Packaging and portable desktop unit tests
        run: LUSH_MAC_TEST_BUN="$(command -v bun)" bun test test/packaging test/desktop
      - name: Build native macOS bundle with private local Bun (never publish)
        run: bun run desktop:build:mac --arch ${{ matrix.arch }} --bun "$(command -v bun)"
      - name: Verify ASAR, both Linux resources and packaged native runtime smoke
        run: bun run desktop:verify:mac --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: lush-macos-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            node_modules/lush-desktop-build/dist/Lush-*-macos-${{ matrix.arch }}.zip
            node_modules/lush-desktop-build/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Build summary
        run: |
          printf '%s\n' '## macOS desktop test bundle' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Native ZIP and SHA256SUMS.txt are available for 14 days. Includes a private native Bun and local Host/daemon sources plus reviewed Linux x64/ARM64 resources for consented SSH deployment.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'No project state or credentials. Unsigned and not notarized: Gatekeeper may prevent opening; do not disable system protections. No Release or update feed was published.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Native runtime imports were smoke-tested. Actual Electron windows, installation, local project startup and cross-machine SSH still require acceptance; no model invocation was performed.' >> "$GITHUB_STEP_SUMMARY"
